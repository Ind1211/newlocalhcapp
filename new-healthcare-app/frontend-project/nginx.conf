server {
    listen 80;
    server_name _;

    # Static React build only — Kong now sits in front of this and handles
    # everything (including routing plain page requests here), so this container
    # no longer proxies /api/ itself.
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
